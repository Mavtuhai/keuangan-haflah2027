<style>
:root{--bg:#f5f7f4;--card:#fff;--tx:#1d2b20;--mu:#667;--pr:#2f6b3a;--pr2:#e3f0e5;--rd:#b3261e;--bd:#d9dfd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121612;--card:#1c231d;--tx:#e8efe9;--mu:#9aa89c;--pr:#6fbf7d;--pr2:#223a27;--rd:#ff8a80;--bd:#33403a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:0 0 8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
button,select,input{font:inherit;color:var(--tx)}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.g{background:var(--pr2);color:var(--pr)}button.r{background:transparent;color:var(--rd);padding:4px 8px}button.s{padding:4px 9px;font-size:13px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:3px 0 9px}
label{font-size:13px;color:var(--mu)}
.saldo{font-size:26px;font-weight:700;color:var(--pr)}.neg{color:var(--rd)}
.row{display:flex;gap:8px}.row>*{flex:1}
.tx{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--bd)}
.tx small{color:var(--mu);display:block}.in{color:var(--pr)}.out{color:var(--rd)}
.pat{display:grid;grid-template-columns:repeat(3,64px);gap:26px;justify-content:center;margin:22px auto;touch-action:none;user-select:none;position:relative}
.dot{width:64px;height:64px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center}
.dot i{width:16px;height:16px;border-radius:50%;background:var(--mu)}.dot.on{border-color:var(--pr);background:var(--pr2)}.dot.on i{background:var(--pr)}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:end center;z-index:9}
.modal>div{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.msg{color:var(--rd);text-align:center;min-height:20px}.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{white-space:nowrap}
img.th{width:44px;height:44px;object-fit:cover;border-radius:8px;cursor:pointer}
.ban{background:#fff3cd;color:#664d03;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}.tag{font-size:11px;background:var(--pr2);color:var(--pr);padding:1px 7px;border-radius:9px}
</style></head><body><main id="app"><div class="card">Memuat…</div></main>
<script>
const DEPT=[["sek","Sekretaris"],["ben","Bendahara"],["aca","Sie Acara"],["lom","Sie Lomba"],["dok","Sie Dokumentasi"],["dek","Sie Dekorasi"],["kea","Sie Keamanan"],["hum","Sie Humas"],["kon","Sie Konsumsi"],["per","Sie Perlengkapan"]];
const ACC=[["adm","Admin"],...DEPT], NAME=Object.fromEntries(ACC);
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp=n=>(n<0?"-":"")+"Rp "+Math.abs(n||0).toLocaleString("id-ID");
/* === ISI DUA BARIS INI (Supabase → Project Settings → API) === */
const CFG={url:"https://wkgbvvqdstinlhuzkcfh.supabase.co",anon:"sb_publishable_Ls9b8pmxBM76hLdkvuUtPQ_60QPXH19"};
let sb=null,tok=null,tmr=null;
const BDL={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
let db=null,me=null,TX=[],LOG=[],RB=[],RA={},PW={},view="home",tab="tx",fdept="all",ready=false;
try{me=sessionStorage.getItem("me")}catch(e){}
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>crypto.randomUUID();
async function hash(a,p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("haflah27|"+a+"|"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const live=()=>TX.filter(t=>!t.del);
function saldo(d){let s=0;for(const t of live()){if(d==="adm"){if(t.dept==="adm"&&t.kind==="in")s+=t.jumlah;if(t.kind==="tf")s-=t.jumlah}else{if(t.dept===d)s+=t.kind==="in"?t.jumlah:-t.jumlah;if(t.kind==="tf"&&t.to===d)s+=t.jumlah}}return s}
let Q=[];try{Q=JSON.parse(localStorage.getItem("q")||"[]")}catch(e){}
const sq=()=>{try{localStorage.setItem("q",JSON.stringify(Q))}catch(e){}};
async function W(col,id,data){if(col!=="tx")return;const x={id,data};if(!navigator.onLine){Q.push(x);sq();render();return}
  try{await pushTx(x);await load()}catch(e){if(!navigator.onLine||/fetch|network/i.test(e.message||"")){Q.push(x);sq();render()}else throw e}}
async function flush(){if(!sb||!navigator.onLine||!Q.length)return;const q=Q;Q=[];sq();for(const x of q){try{await pushTx(x)}catch(e){if(/fetch|network/i.test(e.message||"")){Q.push(x)}else alert("Sinkron gagal: "+e.message)}}sq();await load()}
async function upFoto(d){const blob=await (await fetch(d.foto)).blob(),f=new FormData();f.append("file",blob,"f.jpg");["dept","kind","date","rincian","jumlah"].forEach(k=>f.append(k,d[k]));
  const r=await fetch(CFG.url+"/functions/v1/upload-foto",{method:"POST",headers:{apikey:CFG.anon,Authorization:"Bearer "+tok},body:f}),j=await r.json();if(!r.ok)throw new Error(j.error||"Unggah foto gagal");return j}
async function pushTx(x){const d=x.data;let url=d.foto,file=d.drive?.file;if(url&&url.startsWith("data:")){const u=await upFoto(d);url=u.url;file=u.file}
  const{error}=await sb.from("transactions").insert({client_id:x.id,dept:d.dept,kind:d.kind,to_dept:d.to||null,tx_date:d.date,rincian:d.rincian,item:d.item,harga:d.harga,foto_url:d.kind==="tf"?null:url,foto_file:file||null,created_by:me});
  if(error&&error.code!=="23505")throw new Error(error.message)}
async function upTx(id,d){let url=d.foto,file=d.drive?.file;if(url&&url.startsWith("data:")){const u=await upFoto(d);url=u.url;file=u.file}
  const{error}=await sb.from("transactions").update({tx_date:d.date,rincian:d.rincian,item:d.item,harga:d.harga,foto_url:url,foto_file:file}).eq("id",id);if(error)throw new Error(error.message);await load()}
async function upTf(id,d){const{error}=await sb.from("transactions").update({to_dept:d.to,tx_date:d.date,harga:d.harga}).eq("id",id);if(error)throw new Error(error.message);await load()}
const mapTx=r=>({id:r.id,dept:r.dept,kind:r.kind,to:r.to_dept,date:r.tx_date,rincian:r.rincian,item:r.item,harga:+r.harga,jumlah:+r.jumlah,foto:r.foto_url,drive:{folder:"HSN 2026/"+(NAME[r.dept]||r.dept),file:r.foto_file},fotoLama:r.foto_history||[],del:r.deleted,by:r.created_by,ts:+new Date(r.created_at)});
const mapRab=r=>({id:r.id,dept:r.dept,date:r.tx_date,rincian:r.rincian,item:r.item,harga:+r.harga,jumlah:+r.jumlah,del:r.deleted});
const mapLog=x=>{const a=x.after||{},b=x.before;let d;if(a.open!==undefined)d=a.open?"Pengisian RAB dibuka":"Pengisian RAB ditutup";else if(a.kind==="tf")d="Utama → "+NAME[a.to_dept]+" "+rp(+a.jumlah);else if(b&&(x.action==="edit"||x.action==="ganti foto"||x.action==="RAB edit"))d=`${b.rincian} ${rp(+b.jumlah)} → ${a.rincian} ${rp(+a.jumlah)}`;else d=`${a.rincian} ${rp(+a.jumlah)}`;return{id:x.id,catatan:x.catatan,detailEdit:x.detail_edit,ts:+new Date(x.at),by:x.actor,act:x.action,dept:x.dept,dept2:x.dept2,detail:d}};
let busy=false;
async function load(){if(!sb||busy)return;busy=true;try{
  const a=await sb.from("transactions").select("*").order("tx_date",{ascending:false}).order("created_at",{ascending:false}).limit(5000);if(a.error)throw a.error;TX=a.data.map(mapTx);
  const b=await sb.from("audit_log").select("*").order("at",{ascending:false}).limit(1500);if(!b.error)LOG=b.data.map(mapLog);
  const c=await sb.from("rab_items").select("*").order("tx_date",{ascending:false}).order("created_at",{ascending:false}).limit(5000);if(!c.error)RB=c.data.map(mapRab);
  const d=await sb.from("rab_access").select("*");if(!d.error){RA={};d.data.forEach(r=>RA[r.dept]=r.open)}}
  catch(e){if(/jwt|token|401/i.test(e.message||"")){busy=false;return logout()}}finally{busy=false}render()}
function connect(){sb=supabase.createClient(CFG.url,CFG.anon,{global:{headers:{Authorization:"Bearer "+tok}},auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  try{sb.realtime.setAuth(tok);sb.channel("tx").on("postgres_changes",{event:"*",schema:"public",table:"transactions"},()=>load()).subscribe()}catch(e){}
  clearInterval(tmr);tmr=setInterval(load,20000);load()}
async function callLogin(body){const r=await fetch(CFG.url+"/functions/v1/login",{method:"POST",headers:{"Content-Type":"application/json",apikey:CFG.anon,Authorization:"Bearer "+(body.action==="set"?tok:CFG.anon)},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Gagal ("+r.status+")");return j}
addEventListener("online",flush);addEventListener("offline",()=>render());
const banner=()=>(!navigator.onLine?'<div class="ban">Offline: transaksi tetap bisa dicatat dan akan disinkronkan saat online.'+(Q.length?" Menunggu sinkron: "+Q.length:"")+"</div>":Q.length?'<div class="ban">Menyinkronkan '+Q.length+" catatan…</div>":"");
async function addLog(){}
async function init(){
  if(!window.supabase||CFG.url.includes("PROYEK")){$("#app").innerHTML='<div class="card"><h2>Konfigurasi belum diisi</h2>Isi <code>CFG.url</code> dan <code>CFG.anon</code> di bagian atas skrip (lihat README).</div>';return}
  db=true;ready=true;try{tok=sessionStorage.getItem("tok")}catch(e){}
  if(me&&tok)connect();else me=null;render()}
/* ---------- Login ---------- */
let lsel="adm",pat=[],lmsg="";
function loginView(){
  const has=!!PW[lsel];
  return `<div class="card"><h1>Keuangan Haflah 2027</h1><small style="color:var(--mu)">Pondok Pesantren Al Ma’rufiyyah</small>
  <label>Akun</label><select id="sel">${ACC.map(a=>`<option value="${a[0]}" ${a[0]===lsel?"selected":""}>${a[1]}</option>`).join("")}</select>
  <p style="text-align:center;margin:8px 0 0">Gambar pola untuk masuk</p>
  <div class="pat" id="pat">${dots()}</div>
  <div class="msg" id="lm">${esc(lmsg)}</div>
  <p style="color:var(--mu);font-size:12px;text-align:center">Sesi login berlaku 12 jam. Lupa pola? Minta admin mereset.</p></div>`}
function drawPattern(box,cb){let down=false,pat=[];
  const hit=e=>{const el=document.elementFromPoint(e.clientX,e.clientY)?.closest(".dot");if(el&&box.contains(el)){const i=+el.dataset.i;if(!pat.includes(i)){pat.push(i);el.classList.add("on")}}};
  box.onpointerdown=e=>{down=true;pat=[];box.querySelectorAll(".dot").forEach(d=>d.classList.remove("on"));hit(e)};
  box.onpointermove=e=>{if(down)hit(e)};
  window.onpointerup=()=>{if(!down)return;down=false;cb(pat)}}
const dots=()=>[...Array(9)].map((_,i)=>`<div class="dot" data-i="${i}"><i></i></div>`).join("");
function bindLogin(){
  $("#sel").onchange=e=>{lsel=e.target.value;lmsg="";render()};
  drawPattern($("#pat"),async p=>{if(p.length<4){lmsg="Minimal 4 titik";return render()}
    try{const r=await callLogin({dept:lsel,pattern:p.join("")});tok=r.token;try{sessionStorage.setItem("tok",tok)}catch(e){}enter(lsel);connect()}catch(e){lmsg=e.message;render()}})}
function patternModal(title,cb){const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div><h2>${esc(title)}</h2><div class="pat" id="pm">${dots()}</div><div class="msg" id="pmm"></div><button class="g" id="pmc" style="width:100%">Tutup</button></div>`;document.body.appendChild(m);
  $("#pmc").onclick=()=>{m.remove();render()};
  drawPattern($("#pm"),async p=>{const t=$("#pmm");if(p.length<4){t.textContent="Minimal 4 titik";return}try{await cb(p.join(""));t.style.color="var(--pr)";t.textContent="Pola tersimpan"}catch(e){t.style.color="var(--rd)";t.textContent=e.message}})}
const fpMap=()=>{try{return JSON.parse(localStorage.getItem("fp")||"{}")}catch(e){return{}}};
const fpHas=a=>!!fpMap()[a]&&!!window.PublicKeyCredential;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function fpEnable(){try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"Keuangan Haflah 2027"},user:{id:new TextEncoder().encode(me),name:NAME[me],displayName:NAME[me]},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000}});const m=fpMap();m[me]=b64(c.rawId);localStorage.setItem("fp",JSON.stringify(m));alert("Sidik jari aktif di HP ini untuk akun "+NAME[me])}catch(e){alert("Sidik jari belum bisa diaktifkan di sini ("+(e.name||e)+"). Berfungsi penuh pada versi hosting sendiri (HTTPS).")}}
async function fpLogin(a){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:ub(fpMap()[a])}],userVerification:"required",timeout:60000}});enter(a)}catch(e){lmsg="Sidik jari gagal, gunakan pola";render()}}
function enter(a){me=a;try{sessionStorage.setItem("me",a)}catch(e){}view="home";tab="tx";lmsg="";render()}
function logout(){me=null;tok=null;clearInterval(tmr);try{sb?.removeAllChannels?.()}catch(e){}sb=null;TX=[];LOG=[];RB=[];RA={};try{sessionStorage.removeItem("me");sessionStorage.removeItem("tok")}catch(e){}render()}
/* ---------- Views ---------- */
function txRow(t,canEdit){
  const vd=view.startsWith("d:")?view.slice(2):me,inc=t.kind==="tf"&&t.to===vd&&vd!=="adm";
  const sign=t.kind==="in"||inc?"in":"out",lab=t.kind==="tf"?(inc?"Transfer masuk dari Admin":`Transfer → ${NAME[t.to]}`):t.rincian;
  const amt=(t.kind==="in"||inc?"+":"−")+rp(t.jumlah).replace("Rp ","");
  return `<div class="tx"><div>${t.foto?`<a href="#" data-foto="${t.id}" title="Buka foto bukti" style="float:left;margin-right:9px;font-size:22px;text-decoration:none">📷</a>`:""}<b>${esc(lab)}</b>${t.kind!=="tf"&&t.item?` <span class="tag">${t.item} × ${rp(t.harga).replace("Rp ","")}</span>`:""}<small>${t.date} · ${esc(NAME[t.dept]||t.dept)}${t.del?" · DIHAPUS":""}</small></div>
  <div style="text-align:right"><b class="${t.kind==="tf"&&!inc?"":sign}">${amt}</b><br>${canEdit&&!t.del&&(t.kind!=="tf"||me==="adm")?`<button class="g s" data-e="${t.id}">Edit</button> <button class="r s" data-d="${t.id}">Hapus</button>`:""}${t.del&&me==="adm"?`<button class="g s" data-r="${t.id}">Kembalikan</button>`:""}</div></div>`}
function logRows(l){return l.map(x=>`<div class="tx"><div><b>${esc(x.act)}</b><small>${esc(x.detailEdit||x.detail)}${x.detailEdit?" (diedit)":""}</small>${x.catatan?`<small>📝 ${esc(x.catatan)}</small>`:""}</div><div style="text-align:right"><small>${esc(NAME[x.by]||x.by)}<br>${new Date(x.ts).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"})}</small>${me==="adm"?`<br><button class="g s" data-le="${x.id}">Edit</button> <button class="g s" data-ln="${x.id}">Catatan</button> <button class="r s" data-ld="${x.id}">Hapus</button>`:""}</div></div>`).join("")||'<small>Belum ada log.</small>'}
function rabRow(x,can){return `<div class="tx"><div><b>${esc(x.rincian)}</b> <span class="tag">${x.item} × ${rp(x.harga).replace("Rp ","")}</span><small>${x.date}${x.del?" · DIHAPUS":""}</small></div><div style="text-align:right"><b>${rp(x.jumlah).replace("Rp ","")}</b><br>${can&&!x.del?`<button class="g s" data-re="${x.id}">Edit</button> <button class="r s" data-rd="${x.id}">Hapus</button>`:""}${x.del&&me==="adm"?`<button class="g s" data-rr="${x.id}">Kembalikan</button>`:""}</div></div>`}
function rabView(d,tabs){
  const adm=me==="adm",open=!!RA[d],can=adm||(me===d&&open);
  const items=RB.filter(x=>x.dept===d&&(adm||!x.del)),tot=items.filter(x=>!x.del).reduce((a,x)=>a+x.jumlah,0);
  const st=adm?`<small>Akses pengisian oleh departemen: <b>${open?"DIBUKA":"DITUTUP"}</b></small> <button class="g s" data-ra="${d}">${open?"Tutup":"Buka"}</button>`:(open?'<small class="in">Pengisian RAB sedang dibuka oleh admin.</small>':'<div class="ban">Pengisian RAB sedang ditutup oleh admin. Anda hanya bisa melihat.</div>');
  return `<div class="card"><label>Total RAB ${esc(NAME[d])}</label><div class="saldo">${rp(tot)}</div><small>Rencana saja, tidak mengurangi saldo.</small><div style="margin-top:8px">${st}</div>${can?`<div class="row" style="margin-top:10px"><button data-rn="1">+ Tambah RAB</button></div>`:""}</div>`+tabs+`<div class="card">${items.map(x=>rabRow(x,can)).join("")||"<small>Belum ada rencana.</small>"}</div>`}
function deptView(d){
  const list=TX.filter(t=>(t.dept===d||(t.kind==="tf"&&t.to===d))&&(me==="adm"||!t.del)),s=saldo(d);
  const lg=LOG.filter(x=>x.dept===d||x.dept2===d);
  const tabs=`<div class="tabs"><button class="${tab==="tx"?"":"g"}" data-t="tx">Transaksi</button><button class="${tab==="rab"?"":"g"}" data-t="rab">RAB</button><button class="${tab==="log"?"":"g"}" data-t="log">Log</button><button class="g" data-x="${tab==="rab"?"rab":"dept"}:${d}">Ekspor</button></div>`;
  if(tab==="rab")return rabView(d,tabs);
  return `<div class="card"><label>Saldo ${esc(NAME[d])}</label><div class="saldo ${s<0?"neg":""}">${rp(s)}</div>
  <div class="row" style="margin-top:10px"><button data-n="in">+ History</button><button data-n="out" style="background:var(--rd);color:#fff">− Pengeluaran</button></div></div>`+tabs+
  `<div class="card">${tab==="tx"?(list.map(t=>txRow(t,me===d||me==="adm")).join("")||"<small>Belum ada transaksi.</small>"):logRows(lg)}</div>`}
function adminView(){
  const tot=live().filter(t=>t.dept!=="adm"&&t.kind==="out").reduce((a,t)=>a+t.jumlah,0),inc=live().filter(t=>t.dept==="adm"&&t.kind==="in").reduce((a,t)=>a+t.jumlah,0);
  const tabs=`<div class="tabs"><button class="${view==="home"?"":"g"}" data-v="home">Beranda</button><button class="${view==="in"?"":"g"}" data-v="in">Pemasukan</button><button class="${view==="rab"?"":"g"}" data-v="rab">RAB</button><button class="${view==="log"?"":"g"}" data-v="log">Log</button><button class="g" data-x="lpj">Ekspor File</button></div>`;
  if(view==="home")return tabs+`<div class="card"><label>Saldo Utama</label><div class="saldo ${saldo("adm")<0?"neg":""}">${rp(saldo("adm"))}</div>
  <div class="row" style="margin-top:10px"><button data-n="adm-in">+ Pemasukan umum</button><button data-n="tf" class="g">Transfer saldo</button></div></div>
  <div class="card"><h2>Saldo departemen</h2>${DEPT.map(d=>{const s=saldo(d[0]);return `<div class="tx"><span>${d[1]}</span><span style="display:flex;gap:8px;align-items:center"><b class="${s<0?"neg":""}">${rp(s)}</b><button class="g s" data-o="${d[0]}">Buka</button><button class="g s" data-rs="${d[0]}">Reset pola</button></span></div>`}).join("")}</div>

function compress(file,max=800,q=.6){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let o=c.toDataURL("image/jpeg",q);if(o.length>170000)o=c.toDataURL("image/jpeg",.4);res(o)};im.onerror=rej;im.src=u})}

  $("#sv").onclick=()=>doSave().catch(e=>$("#fm").textContent=String(e.message||e));const doSave=async()=>{

function openRab(ctx,old){const m=document.createElement("div");m.className="modal";

/* ---------- Ekspor ---------- */
const n0=v=>typeof v==="number"&&v>=1000?v.toLocaleString("id-ID"):(v??"");
function buildDept(d){let n=0,t=0;const rows=live().filter(x=>x.dept===d&&x.kind==="out").map(x=>{t+=x.jumlah;return[++n,x.rincian,x.item,x.harga,x.jumlah]});
  return{title:"Laporan Keuangan "+NAME[d]+" – Haflah 2027",file:NAME[d].replace(/ /g,"_")+"_pengeluaran",tables:[{head:["No","Rincian","Item","Harga","Jumlah"],rows,total:["Total",t]}],nb:""}}
function buildLpj(nb){let n=0,ti=0,to=0;const T=[];
  const inc=live().filter(x=>x.dept==="adm"&&x.kind==="in").map(x=>{ti+=x.jumlah;return[++n,x.rincian,x.item>1?x.item:"",x.item>1?x.harga:"",x.jumlah]});
  T.push({name:"PEMASUKAN",head:["No","Rincian","Jumlah Santri","Iuran","Jumlah"],rows:inc,total:["TOTAL KESELURUHAN",ti]});
  DEPT.forEach(([k,nm])=>{let i=0,s=0;const rows=live().filter(x=>x.dept===k&&x.kind==="out").map(x=>{s+=x.jumlah;return[++i,x.rincian,x.item,x.harga,x.jumlah]});to+=s;T.push({name:"PENGELUARAN – "+nm,head:["No","Rincian","Item","Harga","Jumlah"],rows,total:["Jumlah "+nm,s]})});
  T.push({name:"TOTAL PENGELUARAN SELURUH DEPARTEMEN",head:["Keterangan","Jumlah"],rows:[],total:["Total Pengeluaran",to]});
  T.push({name:"REKAPITULASI DANA",head:["Keterangan","Jumlah"],rows:[["Total Pemasukan",ti],["Total Pengeluaran",to]],total:["Sisa Keseluruhan",ti-to]});
  return{title:"Laporan Pertanggungjawaban Keuangan Haflah 2027",file:"LPJ_Haflah_2027",tables:T,nb}}
function buildRab(d){let n=0,t=0;const rows=RB.filter(x=>x.dept===d&&!x.del).map(x=>{t+=x.jumlah;return[++n,x.rincian,x.item,x.harga,x.jumlah]});
  return{title:"Rencana Anggaran Biaya (RAB) "+NAME[d]+" – Haflah 2027",file:NAME[d].replace(/ /g,"_")+"_RAB",tables:[{head:["No","Rincian","Item","Harga","Jumlah"],rows,total:["Total",t]}],nb:""}}
function buildRabAll(nb){const T=[],rk=[];let all=0;
  DEPT.forEach(([k,nm])=>{let i=0,s=0;const rows=RB.filter(x=>x.dept===k&&!x.del).map(x=>{s+=x.jumlah;return[++i,x.rincian,x.item,x.harga,x.jumlah]});all+=s;rk.push([nm,s]);T.push({name:"RAB – "+nm,head:["No","Rincian","Item","Harga","Jumlah"],rows,total:["Jumlah "+nm,s]})});
  T.push({name:"REKAPITULASI RAB",head:["Departemen","Jumlah"],rows:rk,total:["Total RAB Seluruh Departemen",all]});
  return{title:"Rencana Anggaran Biaya (RAB) Haflah 2027",file:"RAB_Haflah_2027",tables:T,nb}}
const trow=(h,t)=>h.length<3?[t[0],t[1]]:["",t[0],...Array(h.length-3).fill(""),t[1]];
function flat(D){const r=[[D.title],[]];D.tables.forEach(t=>{if(t.name)r.push([t.name]);r.push(t.head,...t.rows,trow(t.head,t.total),[])});if(D.nb)r.push(["NB: "+D.nb]);return r}
function mk(D,f){
  if(f==="csv")return["csv",new Blob(["\ufeff"+flat(D).map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"})];
  if(f==="xlsx"){if(!window.XLSX)throw"Pustaka Excel belum termuat";const ws=XLSX.utils.aoa_to_sheet(flat(D)),wb=XLSX.utils.book_new();ws["!cols"]=[{wch:8},{wch:42},{wch:14},{wch:14},{wch:16}];XLSX.utils.book_append_sheet(wb,ws,"Laporan");return["xlsx",new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})],{type:"application/octet-stream"})]}
  if(f==="pdf"){if(!window.jspdf)throw"Pustaka PDF belum termuat";const doc=new jspdf.jsPDF();doc.setFontSize(13);doc.text(D.title,14,16);let y=24;
    D.tables.forEach(t=>{if(y>255){doc.addPage();y=16}if(t.name){doc.setFontSize(10);doc.text(t.name,14,y);y+=3}
      doc.autoTable({startY:y,head:[t.head],body:[...t.rows.map(r=>r.map(n0)),trow(t.head,t.total).map(n0)],styles:{fontSize:8},headStyles:{fillColor:[47,107,58]},didParseCell:h=>{if(h.section==="body"&&h.row.index===t.rows.length)h.cell.styles.fontStyle="bold"}});y=doc.lastAutoTable.finalY+8});
    if(D.nb){doc.setFontSize(9);doc.text("NB: "+D.nb,14,Math.min(y,285))}return["pdf",doc.output("blob")]}
  const h=`<html><head><meta charset="utf-8"><style>table{border-collapse:collapse;width:100%}td,th{border:1px solid #444;padding:3px 6px;font:11pt Times New Roman}th{background:#92d050}</style></head><body><h2>${esc(D.title)}</h2>`+D.tables.map(t=>`${t.name?`<h3>${esc(t.name)}</h3>`:""}<table><tr>${t.head.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(n0(c))}</td>`).join("")}</tr>`).join("")}<tr>${trow(t.head,t.total).map(c=>`<td><b>${esc(n0(c))}</b></td>`).join("")}</tr></table>`).join("")+(D.nb?`<p><b>NB: ${esc(D.nb)}</b></p>`:"")+"</body></html>";
  return["doc",new Blob(["\ufeff"+h],{type:"application/msword"})]}
function exportModal(x){
  const lpj=x==="lpj"||x==="rab-all",m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div><h2>${x==="lpj"?"Ekspor File":x==="rab-all"?"Ekspor RAB (semua departemen)":x.startsWith("rab:")?"Ekspor RAB "+esc(NAME[x.split(":")[1]]):"Ekspor laporan "+esc(NAME[x.split(":")[1]])}</h2>${lpj?'<label>Catatan / NB (opsional)</label><input id="nb" placeholder="Contoh: Masih ada yang belum membayar iuran">':""}<div class="msg" id="em"></div>
  <div class="row" style="flex-wrap:wrap">${[["xlsx","Excel"],["pdf","PDF"],["doc","Word"],["csv","CSV"]].map(f=>`<button data-f="${f[0]}" style="min-width:45%;margin-bottom:8px">${f[1]}</button>`).join("")}</div><button class="g" id="cx" style="width:100%">Tutup</button></div>`;

  m.querySelectorAll("[data-f]").forEach(b=>b.onclick=async()=>{try{const nbv=($("#nb")?.value||"").trim(),D=x==="lpj"?buildLpj(nbv):x==="rab-all"?buildRabAll(nbv):x.startsWith("rab:")?buildRab(x.split(":")[1]):buildDept(x.split(":")[1]);const[ext,blob]=mk(D,b.dataset.f),dl=BDL;await dl.save({filename:D.file+"."+ext,data:blob});$("#em").style.color="var(--pr)";$("#em").textContent="Diunduh: "+D.file+"."+ext}catch(e){$("#em").style.color="var(--rd)";$("#em").textContent=String(e?.message||e)}})}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-n],[data-e],[data-d],[data-r],[data-t],[data-v],[data-o],[data-rs],[data-x],[data-lo],[data-foto],[data-ln],[data-ld],[data-le],[data-ra],[data-rall],[data-orab],[data-rn],[data-re],[data-rd],[data-rr]");if(!b)return;const D=b.dataset;

  if(D.t){tab=D.t;return render()}

  if(D.ra){const{error}=await sb.from("rab_access").update({open:!RA[D.ra],updated_at:new Date().toISOString()}).eq("dept",D.ra);if(error)alert(error.message);return load()}
  if(D.rall!==undefined){const{error}=await sb.from("rab_access").update({open:D.rall==="1",updated_at:new Date().toISOString()}).neq("dept","adm");if(error)alert(error.message);return load()}
  if(D.orab){view="d:"+D.orab;tab="rab";return render()}
  if(D.rn)return openRab(ctx);
  if(D.re){const r=RB.find(x=>x.id===D.re);return r&&openRab(r.dept,r)}
  if(D.rd){if(!confirm("Hapus item RAB ini? (tetap tercatat di log)"))return;return upd("rab_items",D.rd,{deleted:true})}
  if(D.rr)return upd("rab_items",D.rr,{deleted:false});
  if(D.le){const x=LOG.find(l=>String(l.id)===D.le),v=prompt("Ubah teks log (kosongkan untuk mengembalikan ke teks asli):",x?.detailEdit||x?.detail||"");if(v===null)return;const{data,error}=await sb.from("audit_log").update({detail_edit:v.trim()||null}).eq("id",D.le).select();if(error||!data.length)alert(error?.message||"Gagal menyimpan (jalankan pembaruan.sql di Supabase)");return load()}
  if(D.ld){if(!confirm("Hapus entri log ini secara permanen?"))return;const{data,error}=await sb.from("audit_log").delete().eq("id",D.ld).select();if(error||!data.length)alert(error?.message||"Log tidak terhapus (jalankan log-admin.sql di Supabase)");return load()}
  if(D.ln){const x=LOG.find(l=>String(l.id)===D.ln),v=prompt("Catatan untuk entri log ini (kosongkan untuk menghapus catatan):",x?.catatan||"");if(v===null)return;const{data,error}=await sb.from("audit_log").update({catatan:v.trim()||null}).eq("id",D.ln).select();if(error||!data.length)alert(error?.message||"Catatan gagal disimpan (jalankan log-admin.sql di Supabase)");return load()}
  const t=TX.find(x=>x.id===(D.e||D.d||D.r||D.foto));
  if(D.foto){e.preventDefault();if(!t?.foto)return;const w=window.open("","_blank");try{const r=await fetch(CFG.url+"/functions/v1/upload-foto",{method:"POST",headers:{"Content-Type":"application/json",apikey:CFG.anon,Authorization:"Bearer "+tok},body:JSON.stringify({path:t.foto})}),j=await r.json();if(!r.ok)throw new Error(j.error);w.location=j.url}catch(x){w?.close();alert("Foto tidak bisa dibuka: "+x.message)}return}
  if(D.e)return openForm(t.kind,t.dept,t);
  if(D.d){if(!confirm("Hapus transaksi ini? (tetap tercatat di log)"))return;{const{error}=await sb.from("transactions").update({deleted:true}).eq("id",t.id);if(error)alert(error.message);return load()}}
  if(D.r){{const{error}=await sb.from("transactions").update({deleted:false}).eq("id",t.id);if(error)alert(error.message);return load()}}
  if(D.rs)return patternModal("Pola baru untuk "+NAME[D.rs],p=>callLogin({action:"set",dept:D.rs,pattern:p}));
  if(D.x)return exportModal(D.x);
});
